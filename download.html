    <script>
        // ضع روابط صفحات ملفاتك على MediaFire هنا بدلاً من الروابط التجريبية
        const gameLinks = {
            'cursed_isle': {
                name: 'The Cursed Dinosaur Isle H Mod',
                url: 'https://www.mediafire.com/file/YOUR_FILE_CODE_1/The_Cursed_Isle.apk/file' 
            },
            'pangea_primal': {
                name: 'Pangea Primal Age Mod',
                url: 'https://www.mediafire.com/file/YOUR_FILE_CODE_2/Pangea_Primal.apk/file' 
            }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const gameKey = urlParams.get('game');
        
        const gameTitleElem = document.getElementById('gameTitle');
        const downloadBtn = document.getElementById('downloadBtn');
        const timerElem = document.getElementById('timer');

        let targetGame = gameLinks[gameKey] || { name: 'ملف اللعبة المهكرة', url: 'https://t.me/Games_Hacked' };
        
        gameTitleElem.textContent = targetGame.name;
        downloadBtn.href = targetGame.url;

        let timeLeft = 10;
        const countdown = setInterval(() => {
            timeLeft--;
            timerElem.textContent = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerElem.style.display = 'none';
                downloadBtn.classList.remove('btn-disabled');
                downloadBtn.textContent = '🚀 الانتقال للتحميل من MediaFire';
            }
        }, 1000);
    </script>
